name: Publish Frontend Image and Deploy to EC2

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-ec2-deploy-frontend
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push frontend image
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/crm-automation-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend image to EC2 through SSM
    needs: publish
    if: ${{ success() && vars.ENABLE_EC2_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Send frontend deployment command to EC2
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          set -Eeuo pipefail
          IMAGE_TAG="sha-${HEAD_SHA:0:7}"
          DEPLOY_REPO="/opt/crm-automation-backend"
          SCRIPT=$(cat <<EOF
          set -Eeuo pipefail
          if [[ ! -d "$DEPLOY_REPO/.git" ]]; then
            mkdir -p /opt
            git clone --depth 1 --branch main https://github.com/tuananh-developer/crm-automation-backend.git "$DEPLOY_REPO"
          else
            git -c safe.directory="$DEPLOY_REPO" -C "$DEPLOY_REPO" pull --ff-only origin main
          fi
          bash "$DEPLOY_REPO/deploy/ssm-deploy-image.sh" frontend "$IMAGE_TAG"
          EOF
          )
          PARAMETERS=$(jq -cn --arg command "$SCRIPT" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy CRM frontend image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID for $INSTANCE_ID ($IMAGE_TAG)"
          PARAMETERS=$(jq -cn --arg command "$SCRIPT" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "Deploy CRM frontend image $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $COMMAND_ID for $INSTANCE_ID ($IMAGE_TAG)"
      - name: Wait for EC2 deployment result
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for SSM command $COMMAND_ID" >&2
          exit 1